```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - AI Fitness Planner</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <h1>💪 FitBuddy</h1>

        <p class="subtitle">
            AI Fitness Plan Generator using Gemini
        </p>


        <!-- Fitness Form -->
        <div class="card">

            <h2>Create Your Fitness Plan</h2>


            <!-- Age -->
            <div class="form-group">

                <label for="age">Age</label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                    min="10"
                    max="100"
                >

            </div>


            <!-- Gender -->
            <div class="form-group">

                <label for="gender">Gender</label>

                <select id="gender">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Height and Weight -->
            <div class="form-row">

                <div class="form-group">

                    <label for="height">
                        Height (cm)
                    </label>

                    <input
                        type="number"
                        id="height"
                        placeholder="Example: 165"
                        min="50"
                        max="250"
                    >

                </div>


                <div class="form-group">

                    <label for="weight">
                        Weight (kg)
                    </label>

                    <input
                        type="number"
                        id="weight"
                        placeholder="Example: 60"
                        min="10"
                        max="300"
                    >

                </div>

            </div>


            <!-- BMI -->
            <div id="bmiBox" class="bmi-box">

                <h3>📊 Your BMI</h3>

                <div
                    class="bmi-value"
                    id="bmiValue">
                    --
                </div>

                <div
                    class="bmi-category"
                    id="bmiCategory">
                    Enter height and weight
                </div>

            </div>


            <!-- Fitness Goal -->
            <div class="form-group">

                <label for="goal">
                    Fitness Goal
                </label>

                <select id="goal">

                    <option value="">
                        Select Goal
                    </option>

                    <option value="Weight Loss">
                        Weight Loss
                    </option>

                    <option value="Weight Gain">
                        Weight Gain
                    </option>

                    <option value="Muscle Building">
                        Muscle Building
                    </option>

                    <option value="General Fitness">
                        General Fitness
                    </option>

                    <option value="Improve Stamina">
                        Improve Stamina
                    </option>

                </select>

            </div>


            <!-- Fitness Level -->
            <div class="form-group">

                <label for="fitness_level">
                    Fitness Level
                </label>

                <select id="fitness_level">

                    <option value="">
                        Select Level
                    </option>

                    <option value="Beginner">
                        Beginner
                    </option>

                    <option value="Intermediate">
                        Intermediate
                    </option>

                    <option value="Advanced">
                        Advanced
                    </option>

                </select>

            </div>


            <!-- Generate Button -->
            <button onclick="generatePlan()">

                🤖 Generate My Plan

            </button>

        </div>


        <!-- Loading -->
        <div id="loading">

            🤖 FitBuddy is creating your
            personalized fitness plan...

        </div>


        <!-- AI Result -->
        <div
            id="result"
            class="result">
        </div>

    </div>


    <!-- JavaScript -->
    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
```
